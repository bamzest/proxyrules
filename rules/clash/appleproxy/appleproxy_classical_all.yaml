# appleproxy - Classical Format (All Rules)
# Includes all rule types
# IP-CIDR rules exclude 'no-resolve' parameter
# Rules are optimized and sorted for best performance
payload:

  # DOMAIN (8 rules)
  - 'DOMAIN,itunes.apple.com'
  - 'DOMAIN,developer.apple.com'
  - 'DOMAIN,hls.itunes.apple.com'
  - 'DOMAIN,lookup-api.apple.com'
  - 'DOMAIN,books.itunes.apple.com'
  - 'DOMAIN,cvws.icloud-content.com'
  - 'DOMAIN,sandbox.itunes.apple.com'
  - 'DOMAIN,api-glb-sea.smoot.apple.com'

  # DOMAIN-SUFFIX (5 rules)
